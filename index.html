<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>結婚式素数スロット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stage">
    <div class="frame" id="frame">
      <span class="corner corner-tl" aria-hidden="true"></span>
      <span class="corner corner-tr" aria-hidden="true"></span>
      <span class="corner corner-bl" aria-hidden="true"></span>
      <span class="corner corner-br" aria-hidden="true"></span>

      <h1 class="title">当選する人は、、、</h1>

      <p class="counter" id="counter">残り 63 / 63</p>

      <div class="slots" id="slots" aria-live="polite" aria-atomic="true">
        <div class="slot slot-idle">—</div>
      </div>

      <p class="probability" id="probability" aria-live="polite" hidden></p>

      <button class="draw-btn" id="drawBtn" type="button">
        <span id="drawBtnLabel">抽選する</span>
      </button>

      <p class="hint" id="hint">ボタンを押して、最初の番号を引いてください</p>

      <button class="reset-link" id="resetBtn" type="button">はじめからやり直す</button>
    </div>

    <section class="history" aria-label="これまでに出た番号">
      <h2 class="history-title">これまでの記録</h2>
      <div class="history-grid" id="historyGrid">
        <p class="history-empty" id="historyEmpty">まだ番号は出ていません</p>
      </div>
    </section>

    <section class="prime-list" aria-label="63個の素数">
      <h2 class="history-title">63個の素数</h2>
      <ol class="prime-grid" id="primeGrid"></ol>
    </section>
  </div>

  <script src="slot.js"></script>
</body>
</html>
